name: Checks

# Проверка: данные городов, типы, юнит-тесты, сборка и smoke-тест в настоящем браузере
# (Chromium с экраном iPhone: главная, город, маршрут, объект, прогулка с картой и прибытием).
# Запускается на каждый pull request и перед каждой выкладкой (deploy.yml).
# Красный крестик — сливать и выкладывать нельзя, пока не исправлено.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Пакеты городов
        run: npm run content:check
      - name: Типы
        run: npm run typecheck
      - name: Юнит-тесты
        run: npm test
      - name: Сборка
        run: npm run build
      - name: Браузер для smoke-теста
        run: npx playwright install --with-deps chromium
      - name: Smoke-тест
        run: npm run smoke
      - name: Снимки экранов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          if-no-files-found: ignore
