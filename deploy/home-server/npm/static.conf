# Раздаёт любой статический сайт из /srv/sites/<домен>/ по имени домена.
# Новый сайт = папка с именем домена + строка в панели (Forward: static-sites, порт 80).
server {
    listen 80 default_server;
    server_name _;
    root /srv/sites/$host;
    index index.html;
    charset utf-8;

    # Служебная папка git наружу не отдаётся.
    location ~ /\.git { return 404; }

    # Главная и список городов всегда свежие, файлы сборки с хэшем — навсегда.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /data/cities.json { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~ ^/(map|audio|photos)/ { add_header Cache-Control "public, max-age=86400"; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
