name: Voice

# Озвучка голосом Яндекс SpeechKit (API v3), как в «Маленьком караване».
# Запуск вручную: Actions → Voice → Run workflow.
#
# missing — озвучить новое и изменённое: рассказы у объектов и фразы навигатора
#           (что изменилось, видно по хэшу текста в public/audio/*/manifest.json);
# all     — переозвучить всё заново (например, другим голосом);
# samples — образцы голосов (артефакт запуска внизу страницы), заодно проверка ключа.
#
# Нужен секрет YANDEX_SPEECHKIT_KEY — API-ключ сервисного аккаунта Яндекс Облака с ролью
# ai.speechkit-tts.user (можно тот же, что в «Маленьком караване»):
# Settings → Secrets and variables → Actions → New repository secret.
on:
  # Сам — когда поменялись тексты или словарь: озвучивает только новое и изменённое.
  push:
    branches: [main, "claude/**"]
    paths:
      - "content/**"
      - "tools/generate_audio.py"
      - ".github/workflows/voice.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Что сделать"
        type: choice
        options: ["missing", "all", "samples"]
        default: "missing"
      voice:
        description: "Голос"
        type: choice
        options: ["ermil", "alexander", "kirill", "anton", "filipp", "zahar"]
        default: "ermil"
      city:
        description: "Город (пусто — все)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: voice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy requests lameenc
      - name: Ключ
        id: key
        env:
          YANDEX_SPEECHKIT_KEY: ${{ secrets.YANDEX_SPEECHKIT_KEY }}
        run: |
          if [ -z "$YANDEX_SPEECHKIT_KEY" ]; then
            msg="Секрет YANDEX_SPEECHKIT_KEY не задан: Settings → Secrets and variables → Actions."
            # При push — только предупреждение, чтобы правка текста не давала красный крестик.
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::warning::$msg Озвучка пропущена."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$msg"
            exit 1
          fi
      - name: Образцы голосов
        if: inputs.mode == 'samples' && steps.key.outputs.skip != 'true'
        env:
          YANDEX_SPEECHKIT_KEY: ${{ secrets.YANDEX_SPEECHKIT_KEY }}
        run: python3 tools/generate_audio.py --samples samples
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'samples'
        with:
          name: voice-samples
          path: samples/
      - name: Озвучка
        id: gen
        continue-on-error: true
        if: inputs.mode != 'samples' && steps.key.outputs.skip != 'true'
        env:
          YANDEX_SPEECHKIT_KEY: ${{ secrets.YANDEX_SPEECHKIT_KEY }}
        run: python3 tools/generate_audio.py ${{ inputs.city }} --voice ${{ inputs.voice || 'ermil' }} ${{ inputs.mode == 'all' && '--all' || '' }}
      - name: Коммит
        id: commit
        # Коммитим и то, что успело озвучиться до сбоя: manifest.json пишется после каждого файла.
        if: inputs.mode != 'samples' && steps.key.outputs.skip != 'true'
        run: |
          git add -A public/audio
          if git diff --cached --quiet; then
            echo "Озвучка не изменилась."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Озвучка: ${{ inputs.mode || 'missing' }}, голос ${{ inputs.voice || 'ermil' }}"
          git pull -q --rebase && git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Сбой озвучки
        if: steps.gen.outcome == 'failure'
        run: |
          echo "::error::Озвучка прервалась — сделанное закоммичено, остальное см. в шаге «Озвучка»."
          exit 1

  deploy:
    needs: voice
    if: always() && needs.voice.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
