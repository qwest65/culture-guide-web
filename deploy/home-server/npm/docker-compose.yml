# Проба панели Nginx Proxy Manager на одном сайте — рядом с Caddy, ничего не трогая.
#   панель:          http://192.168.0.91:81  (только из домашней сети)
#   вход для сайтов: порт 8080 — сюда Caddy передаёт запросы нового сайта
# Статические сайты лежат в /srv/sites/<домен>/ — их раздаёт контейнер static.
# Откат: docker compose down (в этой папке) и убрать 3 строки из Caddyfile.
services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "8080:80"    # сайты (пока через Caddy)
      - "8443:443"   # на пробе не используется
      - "81:81"      # панель
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - default
      - nextcloud   # чтобы достучаться до Nextcloud по имени контейнера (nextcloud:80)

  static:
    image: nginx:stable-alpine
    container_name: static-sites
    restart: unless-stopped
    volumes:
      - /srv/sites:/srv/sites:ro
      - ./static.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  nextcloud:
    name: nextcloud_default
    external: true
