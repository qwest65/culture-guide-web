name: Photos

# Кандидаты в фото достопримечательностей с Викисклада (свободные лицензии, с автором):
# tools/fetch_photos.py собирает превью и candidates.json (автор, лицензия, ссылка) — они
# прикладываются к запуску архивом (Artifacts внизу страницы запуска), в репозиторий не попадают.
# Редактор выбирает снимки и переносит в public/photos/<город>/ и в поле photos объекта.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "tools/fetch_photos.py"
      - ".github/workflows/photos.yml"
  workflow_dispatch:
    inputs:
      city:
        description: "Город (папка в content/cities)"
        type: string
        default: "troitsk"

permissions:
  contents: read

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Кандидаты
        run: python3 tools/fetch_photos.py "${{ inputs.city || 'troitsk' }}"
      - name: Архив для просмотра
        uses: actions/upload-artifact@v4
        with:
          name: photo-candidates
          path: photos-candidates/
